[project]
name = "geokachel"
version = "0.1.0"
description = "Official German open elevation, surface, building and point-cloud data — one interface, all sixteen Bundesländer, with the credit each licence requires."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "JanderHungrige" }]
keywords = [
    "germany", "deutschland", "elevation", "dem", "dtm", "dsm",
    "dgm1", "dom", "lod2", "laz", "lidar", "pointcloud",
    "geotiff", "citygml", "utm", "bundesland", "geodata",
    "dl-de", "open-data", "opendata", "hoehendaten",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "defusedxml>=0.7",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/JanderHungrige/geokachel"
Source = "https://github.com/JanderHungrige/geokachel"
Issues = "https://github.com/JanderHungrige/geokachel/issues"
Changelog = "https://github.com/JanderHungrige/geokachel/releases"

[project.scripts]
geokachel = "geokachel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geokachel"]

# PEP 561. Without the marker in the wheel, every consumer's type
# checker sees `Any` for all of this, and says nothing about it.
[tool.hatch.build.targets.wheel.force-include]
"geokachel/py.typed" = "geokachel/py.typed"


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12, not the 3.11 floor this package supports. numpy's own type stubs use
# PEP 695 `type` statements, which mypy refuses to parse when told to target
# 3.11 — so the first module that imports numpy turns the whole strict check
# red. The runtime floor stays 3.11; only the checker is told 3.12.
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
